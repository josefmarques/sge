<div class="empty-state">
  <span class="icon-tile icon-tile-slate h-12 w-12">
    <svg class="h-5 w-5" aria-hidden="true" focusable="false"><use href="#i-{{ icon|default:'search' }}"></use></svg>
  </span>
  <div class="max-w-sm">
    <p class="text-sm font-medium text-slate-200">{{ title|default:"Nenhum registro encontrado" }}</p>
    <p class="mt-1 text-xs leading-relaxed text-slate-400">{{ description|default:"Ajuste os filtros ou cadastre um novo registro." }}</p>
  </div>
  {% if action_url %}
    <a href="{{ action_url }}" class="btn btn-secondary btn-sm mt-1">{{ action_label|default:"Criar registro" }}</a>
  {% endif %}
</div>
